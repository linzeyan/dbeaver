[package]
name = "dbconn"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
arrow.workspace = true
async-trait.workspace = true
# For `Browse::sql` and nothing else: quoting a name is dialect-specific, and
# the six drivers that speak SQL would otherwise each keep a copy of the rule.
# `dbsql` has no dependencies of its own, so this costs a compilation unit.
dbsql = { path = "../sql" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# A dev-dependency cycle, which cargo permits and which is the point: the trait
# is only worth testing through the drivers that implement it, and they are the
# ones that depend on this crate.
driver-cassandra = { path = "../drivers/cassandra" }
driver-clickhouse = { path = "../drivers/clickhouse" }
driver-duckdb = { path = "../drivers/duckdb" }
driver-flightsql = { path = "../drivers/flightsql" }
driver-mongodb = { path = "../drivers/mongodb" }
driver-mssql = { path = "../drivers/mssql" }
driver-mysql = { path = "../drivers/mysql" }
driver-postgres = { path = "../drivers/postgres" }
driver-redis = { path = "../drivers/redis" }
driver-sqlite = { path = "../drivers/sqlite" }
driver-trino = { path = "../drivers/trino" }
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio-postgres.workspace = true
mongodb = "3"
bson = "2"
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
mysql_async = { version = "0.37", default-features = false, features = [
    "default-rustls-ring",
] }
# Seeds the Cassandra fixture, for the reason every other vendor crate here is
# named: a fixture built by the driver under test would be vouching for it.
scylla = "1.8"
tiberius = { version = "0.12.3", default-features = false, features = [
    "tds73",
    "rustls",
] }
# tiberius wants a futures-io stream and a tokio TcpStream is not one; this is
# the adapter, and seeding a SQL Server fixture is the only thing it is for.
tokio-util = { version = "0.7", features = ["compat"] }
# Seeds the Trino fixture. There is no Trino crate to name here as the others
# name theirs: the client protocol is HTTP and JSON, so an HTTP client and a JSON
# parser are the vendor library. All five are already in the lock behind the
# ClickHouse and Trino drivers.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
serde_json = "1"
