[package]
name = "dbffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
arrow = { workspace = true, features = ["ffi"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
dbcatalog = { path = "../catalog" }
dbconn = { path = "../conn" }
dbddl = { path = "../ddl" }
dbedit = { path = "../edit" }
dbsql = { path = "../sql" }
driver-cassandra = { path = "../drivers/cassandra" }
driver-clickhouse = { path = "../drivers/clickhouse" }
driver-databricks = { path = "../drivers/databricks" }
driver-duckdb = { path = "../drivers/duckdb" }
driver-flightsql = { path = "../drivers/flightsql" }
driver-mongodb = { path = "../drivers/mongodb" }
driver-mssql = { path = "../drivers/mssql" }
driver-mysql = { path = "../drivers/mysql" }
driver-postgres = { path = "../drivers/postgres" }
driver-redis = { path = "../drivers/redis" }
driver-snowflake = { path = "../drivers/snowflake" }
driver-sqlite = { path = "../drivers/sqlite" }
driver-trino = { path = "../drivers/trino" }
serde = "1"
serde_json = "1"

[dev-dependencies]
arrow = { workspace = true, features = ["ffi"] }
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
