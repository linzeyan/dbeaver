[package]
name = "dbtransfer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
arrow.workspace = true
# For the SQL writer only: quoting a name and escaping a string literal are
# dialect-specific, and the cell editor already reads the same two rules from
# here. A second copy is one that goes wrong quietly.
dbsql = { path = "../sql" }
# The Arrow-to-Parquet writer, which is the whole reason not to write one: the
# format is column chunks, pages, encodings, statistics and a footer, and this
# takes a RecordBatch straight to all of it. Writing it by hand would be
# thousands of lines to arrive at a worse file.
parquet = { version = "58", default-features = false, features = [
    "arrow",
    "zstd",
] }
# A transfer sends its statements through the `Driver` trait rather than to any
# one database, which is what lets the same code copy PostgreSQL to DuckDB. The
# file writers above need none of this, so this is the only dependency the
# crate has on a live connection.
dbconn = { path = "../conn" }

[dev-dependencies]
# Reading a Parquet file back is the only way to check one was written: a
# subtly wrong file is still a file, and its size looks fine.
bytes = "1"
# The dialects the SQL writer is checked against.
dbsql = { path = "../sql" }
# DuckDB as a real embedded database for end-to-end transfer tests: two
# in-memory instances give a genuine database-to-database transfer with no
# server, and the driver implements the Driver trait so the test calls the
# same code path the application uses.
driver-duckdb = { path = "../drivers/duckdb" }
# A real server, for the one property DuckDB cannot show: PostgreSQL accepts a
# statement before it runs it, so a violated constraint is only reported to a
# caller that reads the stream back. That is what `TargetWriter` drains for.
driver-postgres = { path = "../drivers/postgres" }
# The async runtime for #[tokio::test] in the transfer test suite.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
