# CI for the native rewrite.
#
# This file exists only on this branch. `devel` carries the Java upstream and
# its own workflows, and none of the targets below mean anything in that tree —
# so the branch filters are not tidiness, they are what keeps the two histories
# from running each other's builds.
#
# The steps are Makefile targets rather than open-coded cargo and swift calls.
# A CI that reimplements the local commands drifts from them, and then a green
# run stops saying that the documented workflow works.
name: CI

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:

permissions:
  contents: read

# A superseded push has nothing left to prove, and the macOS runner is the
# scarce one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # `make fmt-check` covers Rust and Swift and fails without the Xcode
      # toolchain, so this job runs the half it can and leaves the whole gate to
      # the macOS job.
      - name: Format (Rust)
        run: cargo fmt --all -- --check

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

  # One job per server family rather than one `make test-integration`, which is
  # what this job used to be. That target now wants twelve servers up at once, and
  # a runner has neither the memory for StarRocks beside SQL Server nor the disk
  # for every image — so the suite is split the way the Makefile splits it, one
  # container set per job, and a failure names the database it belongs to.
  integration:
    name: Integration (${{ matrix.server.name }})
    runs-on: ubuntu-latest
    strategy:
      # These jobs are a partition of one suite, not attempts at the same thing.
      # Cancelling the rest because MySQL failed would hide whatever ClickHouse
      # was about to say.
      fail-fast: false
      matrix:
        server:
          # The same containers and the same seed script a developer runs,
          # unedited. `make db-seed` takes a minute or so for the million rows
          # the estimate test checks for, which is the cost of testing against
          # real PostgreSQL rather than a stub that agrees with us.
          - name: PostgreSQL
            up: db-seed db-up-compatible
            test: test-postgres
          - name: MySQL
            up: db-up-mysql db-up-tidb db-up-starrocks
            test: test-mysql
          - name: SQL Server
            up: db-up-mssql
            test: test-mssql
          - name: ClickHouse
            up: db-up-clickhouse
            test: test-clickhouse
          - name: MongoDB
            up: db-up-mongo
            test: test-mongodb
          - name: Redis
            up: db-up-redis
            test: test-redis
          - name: Cassandra
            up: db-up-cassandra
            test: test-cassandra
          - name: Trino
            up: db-up-trino
            test: test-trino
          - name: Arrow Flight SQL
            up: db-up-flightsql
            test: test-flightsql
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Start servers
        run: make ${{ matrix.server.up }}

      - name: Integration tests
        run: make ${{ matrix.server.test }}

  app:
    name: App (macOS)
    # Pinned rather than `macos-latest`: the package's deployment target is
    # macOS 15, so the binary this job builds will not launch on an older
    # runner, and `macos-latest` is whatever GitHub currently points it at.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # swift-format ships inside the Xcode toolchain, which no Linux runner
      # has. This step is the only place the Swift sources get checked at all.
      - name: Format
        run: make fmt-check

      # Builds the core and links it into the app before running the splitter's
      # checks, so this also answers whether the front-end still compiles.
      - name: Swift checks
        run: make test-swift
