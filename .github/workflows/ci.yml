# CI for the native rewrite.
#
# This file exists only on this branch. `devel` carries the Java upstream and
# its own workflows, and none of the targets below mean anything in that tree —
# so the branch filters are not tidiness, they are what keeps the two histories
# from running each other's builds.
#
# The steps are Makefile targets rather than open-coded cargo and swift calls.
# A CI that reimplements the local commands drifts from them, and then a green
# run stops saying that the documented workflow works.
#
# Three layers, each one deciding whether the next is worth paying for:
# `changes` says which jobs this push needs at all, `core` compiles and checks
# the workspace on one runner, and only then do ten container jobs and a macOS
# runner start. Before that ordering existed, a clippy warning cost a full run —
# thirteen runners, a dozen containers, about 270 runner-minutes, and the macOS
# ones billed at ten times the rest — to discover something the first five
# minutes already knew.
#
# `core` compiles for all of them. It hands the container jobs a nextest archive
# and a prebuilt readiness probe, and those jobs then run tests without a
# compiler: nothing under `crates/` is built eleven times any more. What that
# was costing is not an estimate — every integration job spent about twenty
# minutes compiling before it reached its first test, and Redis, whose container
# is ready in a second, took the same twenty-one minutes as Cassandra.
name: CI

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:

permissions:
  contents: read

# A superseded push has nothing left to prove, and the macOS runner is the
# scarce one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One compiler cache and one set of profile knobs for every job that runs cargo,
# set here rather than repeated in each of them.
#
# Two different answers to the same twenty-two crates, because the jobs want
# different things from them. The container jobs are handed compiled test
# binaries and build nothing at all — that is the archive `core` uploads below.
# `core` and the macOS job do have to compile, and what they get is sccache:
# `Swatinem/rust-cache` deletes this workspace's own artifacts from `target/`
# before saving and keeps only the third-party dependencies, which is the right
# thing for it to do and leaves everything under `crates/` to be built again
# from nothing. sccache looks each object up by the hash of its input, so a run
# finds what the run before it compiled.
#
# `CARGO_INCREMENTAL: 0` because sccache cannot cache an incremental
# compilation and quietly stops caching when it meets one. Incremental buys
# nothing here anyway: a runner has no previous build to be incremental against.
#
# `line-tables-only` keeps the file and line in a panic's backtrace, which is
# the whole of what a failure here is read through, and drops the rest — which
# is most of the bytes in a debug build of arrow and tokio, most of the time
# spent linking fifty test binaries, most of what the caches have to carry, and
# most of an archive that is now downloaded ten times per run.
env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Which of the jobs below this push actually needs.
  #
  # Twelve runners, a dozen containers and about twenty minutes was the price of
  # every push, including a push that edited one Swift file. So each job is asked
  # for by name: the Linux job by anything under `crates/`, the macOS job by the
  # front end and the FFI it links, and each database by its own driver — plus,
  # for all of them, the shared crates and the files that decide how any of this
  # is built.
  #
  # The list of changed files comes from the compare API rather than from a
  # checkout: this tree carries twenty years of the upstream Java history, and
  # cloning 216 MB of it to run `git diff` would cost more than the jobs this
  # saves. Anything that makes the answer unknowable — a force push, a new
  # branch, a run somebody started by hand, more files than one page of the API
  # holds — runs everything. A CI that guesses narrow is a CI that goes green
  # without having looked.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.decide.outputs.core }}
      app: ${{ steps.decide.outputs.app }}
      windows: ${{ steps.decide.outputs.windows }}
      servers: ${{ steps.decide.outputs.servers }}
    steps:
      - name: Decide
        id: decide
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 <<'PY'
          import json, os, urllib.error, urllib.request

          # The integration matrix, and what asks for each row. `up` and `test`
          # are Makefile targets a developer runs by hand; `driver` is the crate
          # under `crates/drivers/` whose change is a reason to start these
          # containers.
          SERVERS = [
              # The same containers and the same seed script a developer runs,
              # unedited. `make db-seed` takes a minute or so for the million
              # rows the estimate test checks for, which is the cost of testing
              # against real PostgreSQL rather than a stub that agrees with us.
              #
              # `db-up-pgtls` is a second PostgreSQL, refusing plaintext and
              # serving a certificate that names a host nothing connects to.
              # Both halves are load bearing — without the first, "it connected"
              # says nothing about TLS, and without the second `verify-ca` and
              # `verify-full` cannot be told apart — which is why it cannot be
              # the container above. `db-up-compatible` is CockroachDB and
              # GreptimeDB, both read through this same driver.
              {"name": "PostgreSQL", "up": "db-seed db-up-compatible db-up-pgtls",
               "test": "test-postgres", "driver": "postgres"},
              # TiDB and StarRocks ride along for the same reason: one driver.
              {"name": "MySQL", "up": "db-up-mysql db-up-tidb db-up-starrocks",
               "test": "test-mysql", "driver": "mysql"},
              {"name": "SQL Server", "up": "db-up-mssql",
               "test": "test-mssql", "driver": "mssql"},
              {"name": "ClickHouse", "up": "db-up-clickhouse",
               "test": "test-clickhouse", "driver": "clickhouse"},
              {"name": "MongoDB", "up": "db-up-mongo",
               "test": "test-mongodb", "driver": "mongodb"},
              {"name": "Redis", "up": "db-up-redis",
               "test": "test-redis", "driver": "redis"},
              {"name": "Cassandra", "up": "db-up-cassandra",
               "test": "test-cassandra", "driver": "cassandra"},
              {"name": "Trino", "up": "db-up-trino",
               "test": "test-trino", "driver": "trino"},
              {"name": "Arrow Flight SQL", "up": "db-up-flightsql",
               "test": "test-flightsql", "driver": "flightsql"},
              # Not a database family: an SSH bastion, and the PostgreSQL above
              # it reached through one. `test-tunnel` declares both containers
              # itself, and they are named here anyway so this row reads like the
              # others. It has no driver of its own — the dialling is in `dbffi`,
              # which is shared — so it runs whenever the shared crates move.
              #
              # Worth a runner because a tunnel is the one thing in this tree
              # that cannot be tested without a second machine's worth of moving
              # parts, and it has already been broken by one of sshd's opinions
              # rather than by our code.
              {"name": "SSH tunnel", "up": "db-up-ssh db-up",
               "test": "test-tunnel", "driver": None},
          ]

          # `windows` defaults to true because every call that omits it is one of
          # the "attribute nothing, run everything" paths below, and a gate that
          # quietly defaulted to off would turn those into "run everything except
          # the one platform nobody can check by hand".
          def emit(core, app, servers, why, windows=True):
              print(f"::notice::{why}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"core={'true' if core else 'false'}\n")
                  out.write(f"app={'true' if app else 'false'}\n")
                  out.write(f"windows={'true' if windows else 'false'}\n")
                  out.write("servers=" + json.dumps(
                      [{k: v for k, v in s.items() if k != "driver"} for s in servers]) + "\n")
              raise SystemExit(0)

          base, head = os.environ.get("BASE", ""), os.environ.get("HEAD", "")
          empty = "0" * 40
          if not base or base == empty or not head:
              emit(True, True, SERVERS, "no commit to compare against — running everything")

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/compare/{base}...{head}",
              headers={"Authorization": f"Bearer {os.environ['TOKEN']}",
                       "Accept": "application/vnd.github+json"})
          try:
              answer = json.load(urllib.request.urlopen(request, timeout=30))
          except (urllib.error.URLError, OSError, ValueError) as e:
              emit(True, True, SERVERS, f"the compare API said {e} — running everything")

          files = [f["filename"] for f in answer.get("files", [])]
          if not files or len(files) >= 300:
              emit(True, True, SERVERS,
                   f"{len(files)} files changed — too many to attribute, running everything")

          def infra(path):
              # Everything that decides how any of this is built or brought up,
              # including the vendored crates: `third_party/tiberius` is compiled
              # into the workspace and is not under `crates/`, so without this
              # line a patch to it would ask for nothing at all.
              return (path in {"Cargo.toml", "Cargo.lock", "Makefile", "docker-compose.yml",
                               ".env", "rust-toolchain.toml", ".cargo/config.toml",
                               ".github/workflows/ci.yml"}
                      or path.startswith("tools/")
                      or path.startswith("third_party/"))

          def shared_rust(path):
              # Any crate that is not a driver: conn, ffi, transfer, ddl, sql,
              # catalog, edit. Written as "not a driver" rather than as a list so
              # that a crate added later is shared until somebody says otherwise.
              return path.startswith("crates/") and not path.startswith("crates/drivers/")

          rebuild = any(infra(f) or shared_rust(f) for f in files)
          # Every reason to run a server is also a reason `core` is true — a
          # driver lives under `crates/`, and `rebuild` sets both. The
          # integration jobs lean on that: they are gated on `core` having
          # passed, which would silently never happen if these two could
          # disagree.
          core = rebuild or any(f.startswith("crates/") for f in files)
          # `.swift-format` asks for the macOS job alone: it is the one file in
          # the tree that decides whether `make fmt-check` passes and means
          # nothing to any of the Rust jobs.
          app = rebuild or any(
              f.startswith("apps/macos/") or f.startswith("crates/ffi/")
              or f == ".swift-format" for f in files)
          servers = [s for s in SERVERS
                     if rebuild or (s["driver"] and any(
                         f.startswith(f"crates/drivers/{s['driver']}/") for f in files))]
          # Everything `core` asks for, plus the link check's own sources. It
          # needs to be a superset: a driver change leaves `rebuild` false, and
          # a driver that reaches for a Unix-only API is exactly the mistake this
          # job exists to catch. The extra term is what makes editing the link
          # check run the link check, which reading `core` alone would not.
          windows = core or any(f.startswith("apps/windows/") for f in files)
          emit(core, app, servers,
               f"{len(files)} files changed: core={core}, app={app}, "
               + f"windows={windows}, "
               + f"servers={[s['name'] for s in servers] or 'none'}",
               windows=windows)
          PY

  # The gate. Everything below waits for this, for two reasons that happen to
  # point the same way.
  #
  # The first is what it costs to be wrong: a clippy warning or a failed unit
  # test used to be found by twelve runners at once, ten of which had already
  # pulled their images and started their databases. One runner is enough to
  # find it.
  #
  # The second is that this job is where the workspace gets compiled. It fills
  # both caches — the dependency artifacts that `rust-cache` saves under this
  # shared key, and every object sccache stores — so the jobs after it restore a
  # build instead of repeating one. That is why gating on it does not cost the
  # five minutes it looks like it costs: the jobs it delays each get back far
  # more than that.
  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: taiki-e/install-action@nextest
      # A shared key rather than the default one, which is derived from the job
      # name and so gave each of the twelve jobs a cache of its own. Twelve
      # caches of a gigabyte or so do not fit in the ten this repository is
      # allowed, so they evicted each other and most jobs started cold. One key
      # for every Linux job building the dev profile — which, now that the
      # container jobs compile nothing, means this one and the next run of it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-dev

      # `make fmt-check` covers Rust and Swift and fails without the Xcode
      # toolchain, so this job runs the half it can and leaves the whole gate to
      # the macOS job.
      - name: Format (Rust)
        run: cargo fmt --all -- --check

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      # Packing, not a second compilation: `make test` above built these same
      # binaries, and `cargo nextest archive` collects what it already has.
      - name: Test archive
        run: make test-archive

      # `dbcheck` is taken from where `make test` left it rather than built.
      # `cargo test` builds a package's binaries so that its integration tests
      # can execute them, and uplifts them to `target/debug/` — which is the
      # copy the archive above also carries.
      #
      # It was a `cargo build -p dbffi --bin dbcheck` step here for one run, and
      # that step took 11m21s on top of the 14m36s `make test` had just spent.
      # Naming one package and no test target is a different feature resolution
      # — dev-dependencies contribute nothing to it — so cargo rebuilt the whole
      # dependency graph as a second set of units, and sccache could not help
      # because different features are different rustc invocations. If the file
      # is ever not there, this fails loudly, which is the right way to find out.
      - name: Collect what the container jobs run
        run: |
          mkdir -p ci-payload
          cp target/nextest/archive.tar.zst target/debug/dbcheck ci-payload/
          du -sh ci-payload/*

      # `compression-level: 0` because the archive is already zstd and the probe
      # is an executable: compressing either again spends minutes to save
      # nothing, ten times over on the download side.
      - uses: actions/upload-artifact@v4
        with:
          name: test-payload
          path: ci-payload/
          retention-days: 1
          compression-level: 0

      # Printed because a compiler cache that has quietly stopped working looks
      # exactly like one that is working: the build is correct either way, only
      # slower. The hit rate is the number that says which of those this run was.
      - name: Compiler cache
        if: always()
        run: sccache --show-stats

  # One job per server family rather than one `make test-integration`, which is
  # what this job used to be. That target now wants twelve servers up at once, and
  # a runner has neither the memory for StarRocks beside SQL Server nor the disk
  # for every image — so the suite is split the way the Makefile splits it, one
  # container set per job, and a failure names the database it belongs to.
  #
  # The rows themselves are in the `changes` job above, because a matrix cannot
  # be filtered where it is written: `jobs.<id>.if` cannot see `matrix`, so the
  # only way to not start ten sets of containers for a one-driver change is to
  # hand this job the rows it should run.
  integration:
    name: Integration (${{ matrix.server.name }})
    runs-on: ubuntu-latest
    needs: [changes, core]
    if: needs.changes.outputs.servers != '[]'
    strategy:
      # These jobs are a partition of one suite, not attempts at the same thing.
      # Cancelling the rest because MySQL failed would hide whatever ClickHouse
      # was about to say.
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.changes.outputs.servers) }}
    # Both read by the Makefile: `UNPACKED` sends the integration targets at the
    # binaries `core` compiled instead of building their own, and `DBCHECK`
    # points the readiness gates at the probe it built. Together they are why
    # this job has no compiler cache and needs none — it compiles nothing.
    #
    # `RUSTC_WRAPPER` is cleared for the same reason. Nothing here should reach
    # rustc, and a job that did would otherwise fail on a missing sccache rather
    # than on the interesting fact that it was compiling at all.
    env:
      UNPACKED: ${{ github.workspace }}/ci-tests
      DBCHECK: ${{ github.workspace }}/ci-payload/dbcheck
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: test-payload
          path: ci-payload

      # An artifact travels as a zip, which has no place to record that one of
      # these two is a program.
      - name: Make the probe runnable
        run: chmod +x ci-payload/dbcheck

      # Once, here, rather than inside each `make` below — see the Makefile on
      # why. The archive carries the build scripts' output directories as well
      # as the binaries, which is 778 files for this workspace.
      - name: Unpack the test binaries
        run: make test-unpack ARCHIVE=ci-payload/archive.tar.zst

      - name: Start servers
        run: make ${{ matrix.server.up }}

      # The tail as an annotation, the same arrangement the macOS and Windows
      # jobs carry. The reason is sharper here: a red used to read `exit code 2`
      # and stop, which does not name the failing test, never mind the assertion
      # — and the log that would is behind rights not everyone working on this
      # has. nextest prints its failures last, so the end of the log is the part
      # worth carrying out.
      - name: Integration tests
        run: |
          set -o pipefail
          make ${{ matrix.server.test }} 2>&1 | tee tests.log && exit 0
          python3 -c "import pathlib; \
            print('::error::' + pathlib.Path('tests.log').read_text()[-4000:] \
              .replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))"
          exit 1

  app:
    name: App (macOS)
    needs: [changes, core]
    # Behind the gate when there is a gate, and not behind it when there is not:
    # a change to the Swift sources alone leaves `core` skipped, and a job that
    # took the default view of a skipped dependency would skip with it — which
    # would leave the one job that checks the front end not running on the one
    # kind of change that is nothing but front end. `!cancelled()` is what puts
    # that decision here instead: naming any status function replaces the
    # implicit `success()`, and the two results this will accept are then said
    # out loud rather than left to be inferred.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.app == 'true'
          && (needs.core.result == 'success' || needs.core.result == 'skipped') }}
    # Pinned rather than `macos-latest`: the package's deployment target is
    # macOS 15, so the binary this job builds will not launch on an older
    # runner, and `macos-latest` is whatever GitHub currently points it at.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      # Its own key, and it writes: this job builds the release profile on a
      # different host, so it shares nothing with the Linux jobs above and there
      # is no second macOS job to race it.
      #
      # No cache for `apps/macos/.build`. The package has no external
      # dependencies, so all that directory holds is this app's own objects, and
      # llbuild decides what to rebuild from each source file's timestamp — which
      # a checkout has just set to now. Restoring it would buy a relink at best.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release

      # swift-format ships inside the Xcode toolchain, which no Linux runner
      # has. This step is the only place the Swift sources get checked at all.
      - name: Format
        run: make fmt-check

      # Builds the core and links it into the app before running the splitter's
      # checks, so this also answers whether the front-end still compiles.
      #
      # The tail is repeated as an annotation because reading a job's log needs
      # admin rights on the repository and reading its annotations does not —
      # and this is the one job whose failures cannot be reproduced on the
      # machine this is developed on, which runs a newer Xcode than the runner.
      # Without it, a red job here says only "exit code 2".
      - name: Swift checks
        run: |
          set -o pipefail
          make test-swift 2>&1 | tee /tmp/swift-checks.log && exit 0
          python3 -c "import pathlib; \
            print('::error::' + pathlib.Path('/tmp/swift-checks.log').read_text()[-3000:] \
              .replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))"
          exit 1

      - name: Compiler cache
        if: always()
        run: sccache --show-stats

  # What the Windows front end rests on, established before a line of it is
  # written. The first question — does the core compile off macOS at all — was
  # answered on cddff57109: yes, once the SSH agent's Unix socket was given a
  # platform branch of its own, and nothing else in fifteen drivers objected.
  # What this asks now is a step further in, and is described further down.
  #
  # It has to be a runner, because the question cannot be asked from the machine
  # this is developed on. `cargo check --target aarch64-pc-windows-msvc` gets 153
  # crates in and then stops on `ring`'s build script — Apple's `cc` cannot emit
  # an object for an MSVC target — and every crate that compiles C is behind that
  # same wall. A cross toolchain would only move the wall.
  #
  # Open-coded cargo rather than a Makefile target, against this file's own rule.
  # The rule is there so that CI cannot drift from the commands a developer runs;
  # this job has no such command to drift from, since the build it does is one
  # that fails on every machine in this project except a Windows one.
  #
  # `test` and not `build`, now that building is answered. Three things arrive
  # with that, and the first is what this job was always for:
  # `crates/ffi/tests/conformance.rs` opens by saying it exists "so the FFI
  # contract is validated independently of macOS, which is what keeps the
  # eventual Windows front-end from discovering a Swift-shaped API" — and until
  # now the only machine it had ever been validated on was a Mac. Its
  # argument-contract half needs no database and is written to run under plain
  # `cargo test`; its live half is `#[ignore]`, so no container is implied.
  #
  # Second, this is the first time anything here *links*. DuckDB is C++ compiled
  # into the staticlib, which is why the macOS package carries an explicit
  # `.linkedLibrary("c++")`; whatever the MSVC equivalent of that turns out to
  # be, a test binary is what finds it.
  #
  # Third, `cargo test` rather than nextest, because `cargo test --workspace` is
  # exactly what `make test` runs on the Linux side: the two jobs should differ
  # about the platform and not about the runner.
  #
  # x86_64 rather than the ARM the local VM runs, because the front end is not
  # what is being measured yet and x86_64 is the target every dependency here has
  # already met. The ARM build is the front end's problem, on the day it exists.
  windows:
    name: Core (Windows)
    needs: [changes, core]
    # The macOS job's arrangement, and for its reason: a change to the link check
    # alone leaves `core` skipped, and taking the default view of a skipped
    # dependency would skip the only job that can check that change.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.windows == 'true'
          && (needs.core.result == 'success' || needs.core.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      # Its own key for the same reason the macOS job has one: a different host
      # builds different artifacts, and there is no second Windows job to race.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-dev

      # The tail is repeated as an annotation for the reason the macOS job gives,
      # and more so here: that job's failures merely need a newer Xcode to
      # reproduce, while this one's cannot be reproduced on any machine this
      # project is developed on at all. The first red run said `exit code 1` and
      # nothing else, which is a job that reports a problem and withholds it.
      #
      # `shell: bash` because the default on a Windows runner is PowerShell,
      # which has no `pipefail` and would report `tee`'s exit code — the same
      # trap the Makefile carries a note about.
      #
      # The log goes in the working directory rather than `/tmp`. Python here is
      # a native Windows build and does not resolve the Git Bash path: `/tmp/x`
      # reaches the shell fine and reaches Python as a filename that does not
      # exist, so the annotation step would fail on its own while reporting
      # nothing about the build. A relative path is the same path to both.
      #
      # 4000 because GitHub truncates an annotation at 4096 characters and does
      # it from the end — which is the end this is for. Asking for 5000, as this
      # did, spent the whole budget on the middle of the log and dropped the
      # `failures:` block cargo prints last, so a red run listed every test that
      # passed and stopped one line before saying which one had not.
      - name: Test the core
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee build.log && exit 0
          python -c "import pathlib; \
            print('::error::' + pathlib.Path('build.log').read_text()[-4000:] \
              .replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))"
          exit 1

      # Both halves of this are cargo, and cargo has to run before the MSVC
      # environment below is set up — see that step for why.
      #
      # `cargo test` above never built the staticlib: it is a crate type cargo
      # produces for `build` and not for a test harness, so this is what first
      # asks the archiver to run.
      #
      # Then a link line, asked of the compiler rather than kept in a list: a
      # Rust staticlib does not record that its contents need ws2_32 and friends,
      # the same gap macOS covers by naming `c++` in Package.swift. `--lib` is
      # not optional — the crate declares two crate types and `--crate-type` may
      # only narrow a single target, and without it cargo stops with "crate types
      # to rustc can only be passed to one target". A file rather than the teed
      # log, because reading that from inside its own pipe races the flush — and
      # under `target/` rather than beside it, because that directory is ignored
      # and `vm-build.sh` runs `git clean` between the build and the checks.
      - name: Build the staticlib and ask for its link line
        shell: bash
        run: |
          set -o pipefail

          staticlib() {
            cargo build -p dbffi || return 1
            cargo rustc -p dbffi --lib --crate-type staticlib \
              -- --print native-static-libs >target/natives.txt 2>&1 || {
                cat target/natives.txt
                return 1
              }
            cat target/natives.txt
          }

          staticlib 2>&1 | tee staticlib.log && exit 0
          python -c "import pathlib; \
            print('::error::' + pathlib.Path('staticlib.log').read_text()[-4000:] \
              .replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))"
          exit 1

      # Everything above proves the core builds and its own tests pass. It says
      # nothing about the question a front end actually asks, because Swift is
      # the only thing that has ever linked this library, and it does so through
      # a modulemap and a SwiftPM link line, neither of which exists here.
      #
      # `apps/windows/ffi-check` asks that question with no UI framework in the
      # way, so a red run here is about the core rather than about XAML. It links
      # the staticlib and then uses it: DuckDB in memory, one query, and the
      # batch read back through the Arrow C Data Interface with its values
      # checked against what the SQL fixed. That second half is there because
      # `dbffi.h` is written by hand and nothing else compares it against the
      # library it describes — the Rust harness calls the functions from Rust and
      # never reads the header, and Swift reads only the part it uses. The header
      # still lives under `apps/macos` because Swift is still its only real
      # consumer; the day the WinUI project exists is the day moving it somewhere
      # neutral pays for itself.
      #
      # This comes last, after every cargo invocation, and that order is load
      # bearing. rustc finds the MSVC linker on its own; putting MSVC on PATH
      # does not help it and actively breaks it, because under `shell: bash` Git
      # ships a coreutils `link` in `/usr/bin` that wins the lookup. A cargo
      # build after this step dies inside `libduckdb-sys` with `/usr/bin/link:
      # extra operand`, which reads like a DuckDB problem and is a PATH problem.
      # Only `cl` needs what this sets up.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Use the core from C++, and draw with it
        shell: bash
        run: |
          set -o pipefail

          # The `cl` lines live in `apps/windows/tools/checks.sh` rather than
          # here. This file opens by saying that a CI which reimplements the
          # local commands drifts from them, and there is a second machine
          # running these now — `vm-build.sh` drives a Windows VM so the
          # compiler can answer in seconds instead of in a round trip. Two
          # copies of one link line is precisely the drift that warning is about.
          #
          # What stays here is what is specific to being CI: the annotations.
          # The script prints; this decides what a reader without log access
          # gets to see.
          if bash apps/windows/tools/checks.sh 2>&1 | tee checks.log; then
            echo "::notice::Windows link line for dbffi.lib:$(
              grep -o 'system libraries:.*' checks.log | head -1 | cut -d: -f2-)"
            grep -o '[0-9]* pixels painted.*' checks.log \
              | while read -r line; do echo "::notice::Direct2D $line"; done
            exit 0
          fi
          python -c "import pathlib; \
            print('::error::' + pathlib.Path('checks.log').read_text()[-4000:] \
              .replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))"
          exit 1

      - name: Compiler cache
        if: always()
        run: sccache --show-stats
