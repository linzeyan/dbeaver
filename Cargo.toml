[workspace]
resolver = "3"
members = [
    "crates/catalog",
    "crates/conn",
    "crates/ddl",
    "crates/drivers/cassandra",
    "crates/drivers/clickhouse",
    "crates/drivers/duckdb",
    "crates/drivers/mongodb",
    "crates/drivers/mssql",
    "crates/drivers/mysql",
    "crates/drivers/postgres",
    "crates/drivers/redis",
    "crates/drivers/sqlite",
    "crates/drivers/trino",
    "crates/edit",
    "crates/ffi",
    "crates/sql",
]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
arrow = "58"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-postgres = "0.7"
futures-util = "0.3"
thiserror = "2"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Phase 0 measures release behavior; make the profiling build representative.
[profile.profiling]
inherits = "release"
debug = true
