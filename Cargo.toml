[workspace]
resolver = "3"
members = [
    "crates/catalog",
    "crates/conn",
    "crates/ddl",
    "crates/drivers/cassandra",
    "crates/drivers/clickhouse",
    "crates/drivers/databricks",
    "crates/drivers/duckdb",
    "crates/drivers/flightsql",
    "crates/drivers/mongodb",
    "crates/drivers/mssql",
    "crates/drivers/mysql",
    "crates/drivers/postgres",
    "crates/drivers/redis",
    "crates/drivers/snowflake",
    "crates/drivers/sqlite",
    "crates/drivers/trino",
    "crates/edit",
    "crates/ffi",
    "crates/sql",
]
# The vendored tiberius is built as a dependency, never as one of ours. Excluding
# it keeps `--workspace` meaning "code this repository wrote": upstream's source
# is not ours to hold to this workspace's fmt and clippy settings, and its own
# test suite wants a live SQL Server configured its way.
exclude = ["third_party/tiberius"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
arrow = "58"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-postgres = "0.7"
futures-util = "0.3"
thiserror = "2"
async-trait = "0.1"

# tiberius is read from `third_party/tiberius`, not from crates.io. The published
# 0.12.3 walks into `todo!()` when it decodes `geometry`, `geography`,
# `hierarchyid` and `sql_variant`, and this workspace builds release with
# `panic = "abort"` — so browsing an ordinary table with one of those columns
# killed the process outright. The copy there decodes them instead. See
# `third_party/README.md` for what was changed and what it was taken from.
#
# A `[patch]` rather than a path dependency in the driver's own manifest, so that
# there is one place saying which tiberius this workspace builds against, and so
# that nothing can end up linking two of them.
[patch.crates-io]
tiberius = { path = "third_party/tiberius" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Phase 0 measures release behavior; make the profiling build representative.
[profile.profiling]
inherits = "release"
debug = true
