[workspace]
resolver = "3"
members = [
    "crates/catalog",
    "crates/conn",
    "crates/ddl",
    "crates/diff",
    "crates/drivers/athena",
    "crates/drivers/bigquery",
    "crates/drivers/cassandra",
    "crates/drivers/clickhouse",
    "crates/drivers/databricks",
    "crates/drivers/duckdb",
    "crates/drivers/flightsql",
    "crates/drivers/mongodb",
    "crates/drivers/mssql",
    "crates/drivers/mysql",
    "crates/drivers/postgres",
    "crates/drivers/redis",
    "crates/drivers/snowflake",
    "crates/drivers/sqlite",
    "crates/drivers/trino",
    "crates/edit",
    "crates/ffi",
    "crates/sql",
    "crates/transfer",
    "crates/tunnel",
]
# The vendored tiberius is built as a dependency, never as one of ours. Excluding
# it keeps `--workspace` meaning "code this repository wrote": upstream's source
# is not ours to hold to this workspace's fmt and clippy settings, and its own
# test suite wants a live SQL Server configured its way.
exclude = ["third_party/tiberius"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
arrow = "58"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-postgres = "0.7"
futures-util = "0.3"
# Pure Rust SSH, chosen over bindings to libssh2 so that the core stays one
# binary with no C dependency and no sidecar — the same rule the rest of this
# tree is built on. `russh-keys` was folded in and is reached as `russh::keys`,
# so there is no second crate to add.
russh = "0.62"
# Already in the tree as somebody else's dependency; made a direct one because
# rewriting a connection string's host and port is the kind of string surgery
# that is fine until an IPv6 literal or a password with an `@` in it arrives.
url = "2"
thiserror = "2"
async-trait = "0.1"
lax-sql = "0.3"
# Here only to name the `NewLineKind` that lax-sql's config requires and does not
# re-export. Its major has to stay on whichever lax-sql depends on: with 0.68 in
# the tree the compiler reports `expected NewLineKind, found NewLineKind`, two
# different crates wearing the same type name.
dprint-core = "0.67"

# tiberius is read from `third_party/tiberius`, not from crates.io. The published
# 0.12.3 walks into `todo!()` when it decodes `geometry`, `geography`,
# `hierarchyid` and `sql_variant`, and this workspace builds release with
# `panic = "abort"` — so browsing an ordinary table with one of those columns
# killed the process outright. The copy there decodes them instead. See
# `third_party/README.md` for what was changed and what it was taken from.
#
# A `[patch]` rather than a path dependency in the driver's own manifest, so that
# there is one place saying which tiberius this workspace builds against, and so
# that nothing can end up linking two of them.
[patch.crates-io]
tiberius = { path = "third_party/tiberius" }

# `lto = "thin"` rather than `"fat"` on measurement, not on taste: built both
# ways, the linked app's `__text` differed by 4 KB out of 50 MB (0.008%) and the
# shipped, stripped binary came out 328 KiB *larger* under fat, for a 2m09s core
# build. Nothing here is cross-crate-inlinable enough for fat to pay — half the
# code is DuckDB's C++, which LTO of Rust crates never sees. Size work for this
# app belongs at the link step instead: see the strip in
# `apps/macos/scripts/package.sh`, which is worth 18 MB.
#
# Two size knobs were measured here and deliberately not taken:
#
#   `strip = true` does nothing for us. This workspace's release artifact is a
#   staticlib; the shipped Mach-O is linked by SwiftPM, and its symbols come from
#   the archive members' own tables, which the linker needs and cargo's strip
#   never touches. Setting it produced a byte-identical app binary.
#
#   `profile.release.package.libduckdb-sys.opt-level = "s"` is real — 7.81 MB off
#   the shipped binary, DuckDB's C++ shrinking 36% — but it buys that by
#   de-optimising a vectorised query engine, and `make bench-core` covers
#   PostgreSQL-to-Arrow, not this path. Declined until something measures it.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Phase 0 measures release behavior; make the profiling build representative.
[profile.profiling]
inherits = "release"
debug = true
